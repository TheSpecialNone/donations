name: Update donation data

on:
  schedule:
    - cron: "*/15 * * * *" 
  workflow_dispatch: {}     

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate donations.json
        env:
          ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
        run: node update-data.js

      - name: Commit if changed
        run: |
          git config user.name "donation-bot"
          git config user.email "actions@users.noreply.github.com"
          git diff --quiet donations.json || (git add donations.json && git commit -m "Update donation data" && git push)
