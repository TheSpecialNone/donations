name: Update donation data

# Only useful once update-data.js's fetchTransactionsFromRoblox() is filled
# in and USE_LIVE_FETCH is set to true. Add your session cookie as a repo
# secret named ROBLOX_COOKIE (Settings → Secrets and variables → Actions)
# before enabling this.

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes
  workflow_dispatch: {}     # lets you trigger it manually too

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate donations.json
        env:
          ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
        run: node update-data.js

      - name: Commit if changed
        run: |
          git config user.name "donation-bot"
          git config user.email "actions@users.noreply.github.com"
          git diff --quiet donations.json || (git add donations.json && git commit -m "Update donation data" && git push)
